name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The floor the vendored checks promise, and current.
        node: [20, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}

      - name: Syntax-check every script
        run: find scripts -name '*.mjs' -print0 | xargs -0 -n1 node --check

      - name: Fixture checks
        run: ./tests/run.sh

      - name: Manifests agree
        run: node .github/scripts/check-manifests.mjs

  version:
    # A change merged under a version that did not move never reaches anyone:
    # Claude Code compares the version string, not the content.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Version bumped when shipped files change
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: node .github/scripts/check-version-bump.mjs "$BASE" "$HEAD"
