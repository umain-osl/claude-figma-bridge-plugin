name: CI

on:
  push:
    branches: [main]
  # `edited` matters: the PR title is one of the things checked, and retitling a
  # PR after a green run would otherwise leave that check stale.
  pull_request:
    types: [opened, synchronize, reopened, edited]

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The floor the vendored checks promise, and current.
        node: [20, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}

      - name: Syntax-check every script
        run: find scripts -name '*.mjs' -print0 | xargs -0 -n1 node --check

      - name: Fixture checks
        run: ./tests/run.sh

      - name: Manifests agree
        run: node .github/scripts/check-manifests.mjs

  version:
    # A change merged under a version that did not move never reaches anyone:
    # Claude Code compares the version string, not the content.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Version bumped when shipped files change
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: node .github/scripts/check-version-bump.mjs "$BASE" "$HEAD"

  commit-messages:
    # The commit log is this repo's only changelog, and it is only readable while
    # the subjects are. Both the commits and the PR title are checked, because a
    # merge commit keeps the subjects while a squash merge uses the title.
    name: commit messages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Conventional Commits
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: node .github/scripts/check-commit-messages.mjs "$BASE" "$HEAD"
      - name: The gate can still fail
        # A validator that has quietly started passing everything is worse than
        # no validator, because the log looks enforced.
        run: |
          printf 'update the readme\n' > /tmp/bad-message
          if node .github/scripts/check-commit-messages.mjs --file /tmp/bad-message; then
            echo "The validator accepted a non-conventional subject." >&2
            exit 1
          fi
